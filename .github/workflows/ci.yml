name: Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  build-test-package:
    name: Build, Teste e Package
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Resolver dependências e compilar
        run: mvn -B clean compile

      - name: Executar testes unitários
        run: mvn -B test

      - name: Empacotar aplicação
        run: mvn -B package -DskipTests

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: sistema-bancario
          path: target/*.jar

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t sistema-bancario:${{ github.sha }} .

  tag:
    name: Criar tag de build
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar tag com timestamp
        id: tag
        run: |
          TAG="build-$(date -u +'%Y%m%d-%H%M%S')"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Criar e enviar tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag $TAG
          git push origin $TAG

  rc:
    name: Release Candidate (staging)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'pull_request' && github.base_ref == 'staging'

    steps:
      - name: Baixar código (com histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identificar tipo de PR
        id: tipo
        run: |
          echo "Origem: ${{ github.head_ref }}"

          if [ "${{ github.head_ref }}" = "main" ]; then
            echo "tipo=main" >> $GITHUB_OUTPUT
          elif [[ "${{ github.head_ref }}" == bugfix* ]]; then
            echo "tipo=bugfix" >> $GITHUB_OUTPUT
          else
            echo "tipo=outro" >> $GITHUB_OUTPUT
          fi

      - name: Mostrar tipo detectado
        run: echo "Tipo detectado: ${{ steps.tipo.outputs.tipo }}"

      - name: Buscar última tag
        id: last_tag
        run: |
          TAG=$(git tag --sort=-creatordate | head -n 1)
          echo "Ultima tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Gerar próxima versão RC
        id: nova_tag
        run: |
          ULTIMA="${{ steps.last_tag.outputs.tag }}"

          echo "Última tag encontrada: $ULTIMA"

          if [ -z "$ULTIMA" ]; then
            NOVA="rc-1.0"
          else
            if [ "${{ steps.tipo.outputs.tipo }}" = "main" ]; then
              NUM=$(echo $ULTIMA | sed 's/rc-//' | awk -F. '{print $2+1}')
              NOVA="rc-1.$NUM"
            elif [ "${{ steps.tipo.outputs.tipo }}" = "bugfix" ]; then
              BASE=$(echo $ULTIMA | sed 's/rc-//')
              MAJOR=$(echo $BASE | awk -F. '{print $1}')
              MINOR=$(echo $BASE | awk -F. '{print $2}')
              PATCH=$(echo $BASE | awk -F. '{print $3+1}')
              NOVA="rc-$MAJOR.$MINOR.$PATCH"
            else
              NOVA="rc-temp"
            fi
          fi

          echo "Nova tag: $NOVA"
          echo "tag=$NOVA" >> $GITHUB_OUTPUT

      - name: Criar tag RC
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag ${{ steps.nova_tag.outputs.tag }}
          git push origin ${{ steps.nova_tag.outputs.tag }}