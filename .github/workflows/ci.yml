name: Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  build-test-package:
    name: Build, Teste e Package
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Resolver dependências e compilar
        run: mvn -B clean compile

      - name: Executar testes unitários
        run: mvn -B test

      - name: Empacotar aplicação
        run: mvn -B package -DskipTests

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: sistema-bancario
          path: target/*.jar

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t sistema-bancario:${{ github.sha }} .

  tag:
    name: Criar tag de build
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar tag com timestamp
        id: tag
        run: |
          TAG="build-$(date -u +'%Y%m%d-%H%M%S')"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Criar e enviar tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag $TAG
          git push origin $TAG
