name: Pipeline CI

# ─────────────────────────────────────────────
# GATILHOS DO PIPELINE
# ─────────────────────────────────────────────
on:
  push:
    branches: [main, staging, production]
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main, staging, production]

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  # JOB 1 – INTEGRAÇÃO CONTÍNUA BÁSICA
  ci-pipeline:
    name: Build, Quality, Test & Package
    runs-on: ubuntu-latest
    # Roda em pushes na main ou em PRs (abertos, atualizados ou aceitos)
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Resolver dependências
        run: mvn -B dependency:resolve

      - name: Compilar (Build)
        run: mvn -B clean compile

      - name: Análise Estática de Código (PMD)
        run: mvn -B pmd:check

      - name: Executar testes unitários
        run: mvn -B test

      - name: Empacotar aplicação JAR
        run: mvn -B package -DskipTests

      - name: Gerar pacote ZIP do sistema
        run: |
          sudo apt-get update && sudo apt-get install zip -y
          zip -j sistema-bancario.zip target/*.jar

      - name: Upload do artefato ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pacote-sistema-bancario
          path: sistema-bancario.zip

  # JOB 2 – DOCKER BUILD & PUBLISH
  docker:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: ci-pipeline
    # Só faz o push da imagem se for push direto na main ou PR mergeado
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      # O Dockerfile provavelmente precisa do JAR para compilar a imagem
      - name: Baixar artefato ZIP
        uses: actions/download-artifact@v4
        with:
          name: pacote-sistema-bancario
          path: pacote/

      - name: Extrair JAR para a pasta target
        run: |
          mkdir -p target
          unzip pacote/sistema-bancario.zip -d target/

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sistema-bancario:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sistema-bancario:latest

  # JOB 3 – TAG DE BUILD (MAIN)
  tag-build:
    name: Tag de Build (Main)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Criar e enviar tag
        run: |
          TAG="build-$(date -u +'%Y%m%d-%H%M%S')"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $TAG
          git push origin $TAG

  # JOB 4 – RELEASE CANDIDATE (STAGING)
  tag-rc:
    name: Tag Release Candidate (Staging)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'staging'
    steps:
      - name: Baixar código (branch de destino)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Gerar e aplicar nova tag RC
        run: |
          ORIGEM="${{ github.event.pull_request.head.ref }}"
          echo "PR aceito. Origem: $ORIGEM"
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          ULTIMA=$(git tag --list "rc-*" --sort=-v:refname | head -n 1 || echo "")
          
          if [ -z "$ULTIMA" ]; then
            NOVA=$([ "$ORIGEM" = "main" ] && echo "rc-1.0" || echo "rc-1.0.1")
          else
            BASE=$(echo "$ULTIMA" | sed 's/^rc-//')
            MAJOR=$(echo "$BASE" | awk -F. '{print $1}')
            MINOR=$(echo "$BASE" | awk -F. '{print $2}')
            
            if [ "$ORIGEM" = "main" ]; then
              MINOR=$((MINOR + 1))
              NOVA="rc-$MAJOR.$MINOR"
            elif [[ "$ORIGEM" == bugfix* ]]; then
              ULTIMA_XY=$(git tag --list "rc-$MAJOR.$MINOR*" --sort=-v:refname | head -n 1)
              PATCH_ATUAL=$(echo "${ULTIMA_XY#rc-}" | awk -F. '{print $3}')
              PATCH_NOVO=$((${PATCH_ATUAL:-0} + 1))
              NOVA="rc-$MAJOR.$MINOR.$PATCH_NOVO"
            else
              echo "Branch não suportada para staging." && exit 1
            fi
          fi
          
          echo "Criando tag: $NOVA"
          git tag $NOVA
          git push origin $NOVA

  # JOB 5 – RELEASE PRODUÇÃO E HOTFIXES (PRODUCTION)
  tag-release:
    name: Tag Release (Production)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'production'
    steps:
      - name: Baixar código (branch de destino)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Gerar e aplicar nova tag Rel
        run: |
          ORIGEM="${{ github.event.pull_request.head.ref }}"
          echo "PR aceito. Origem: $ORIGEM"
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          ULTIMA=$(git tag --list "rel-*" --sort=-v:refname | head -n 1 || echo "")
          
          if [ -z "$ULTIMA" ]; then
            NOVA=$([ "$ORIGEM" = "staging" ] && echo "rel-1.0" || echo "rel-1.0.1")
          else
            BASE=$(echo "$ULTIMA" | sed 's/^rel-//')
            MAJOR=$(echo "$BASE" | awk -F. '{print $1}')
            MINOR=$(echo "$BASE" | awk -F. '{print $2}')
            
            if [ "$ORIGEM" = "staging" ]; then
              MINOR=$((MINOR + 1))
              NOVA="rel-$MAJOR.$MINOR"
            elif [[ "$ORIGEM" == hotfix* ]]; then
              ULTIMA_XY=$(git tag --list "rel-$MAJOR.$MINOR*" --sort=-v:refname | head -n 1)
              PATCH_ATUAL=$(echo "${ULTIMA_XY#rel-}" | awk -F. '{print $3}')
              PATCH_NOVO=$((${PATCH_ATUAL:-0} + 1))
              NOVA="rel-$MAJOR.$MINOR.$PATCH_NOVO"
            else
              echo "Branch não suportada para production." && exit 1
            fi
          fi
          
          echo "Criando tag: $NOVA"
          git tag $NOVA
          git push origin $NOVA