name: "Verificar Commits do PR"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-commits:
    name: Validar Mensagens e Issues dos Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checar commits via GitHub Script
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo;
            
            // Fetch all commits from the Pull Request
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: prNumber,
            });
            
            const regex = /^#([0-9]+) - .+/;
            
            for (const commitObj of commits) {
              const message = commitObj.commit.message.split('\n')[0]; // Pega primeira linha da mensagem do commit
              
              // Validation 1: Regex Format
              const match = message.match(regex);
              if (!match) {
                core.setFailed(`ERRO: O commit "${message}" não segue o padrão exigido: #NUM_ISSUE - MENSAGEM`);
                return;
              }
              
              const issueNumber = match[1];
              
              // Validation 2: Issue Existence Validation
              try {
                await github.rest.issues.get({
                  owner: repo.owner,
                  repo: repo.repo,
                  issue_number: parseInt(issueNumber)
                });
                console.log(`Commit válido: ${message} (Issue #${issueNumber} confirmada)`);
              } catch (error) {
                if (error.status === 404) {
                  core.setFailed(`ERRO: A issue #${issueNumber} informada no commit "${message}" não existe neste repositório.`);
                } else {
                  core.setFailed(`Erro ao verificar a issue #${issueNumber}: ${error.message}`);
                }
                return;
              }
            }